<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서현고등학교 꿈꾸는 글마루 출석관리 시스템</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --primary-color:#81c784; --primary-dark:#558b2f; --bg-color:#f1f8e9; --text-main:#33691e; }
    body { font-family:'Noto Sans KR',sans-serif; background:var(--bg-color); margin:0; padding:20px; display:flex; flex-direction:column; align-items:center; min-height:100vh; color:var(--text-main); }
    .container { background:white; padding:40px; border-radius:20px; box-shadow:0 8px 30px rgba(85,139,47,.08); width:100%; max-width:400px; text-align:center; box-sizing:border-box; }
    h1 { font-size:1.45em; line-height:1.4; }
    .clock-container { background:#e8f5e9; padding:20px; border-radius:15px; margin-bottom:25px; border:1px solid #c8e6c9; }
    .date-text { font-size:1.1em; color:#558b2f; font-weight:700; }
    .time-text { font-size:2.4em; font-weight:900; color:#2e7d32; }
    .notice { background:#fffde7; border:1px solid #fff59d; padding:12px; border-radius:10px; font-size:.92em; color:#795548; margin-bottom:15px; line-height:1.5; }
    .login-form { display:flex; flex-direction:column; gap:10px; margin-top:20px; text-align:center; align-items: center; justify-content: center; }
    input[type="text"], input[type="password"] { padding:15px; font-size:0.95em; border:2px solid #c8e6c9; border-radius:10px; outline:none; width:100%; box-sizing:border-box; text-align: center;}
    .btn { padding:14px; font-size:1.03em; font-weight:bold; border-radius:10px; cursor:pointer; width:100%; border:none; min-height:55px; margin-top:10px; transition:.2s; text-decoration:none; box-sizing:border-box; display:flex; align-items:center; justify-content:center; }
    .btn-solid { background:var(--primary-color); color:white; }
    .btn-outline { background:white; border:2px solid var(--primary-color); color:var(--primary-dark); }
    .btn-danger { background:white; border:2px solid #e57373; color:#c62828; }
    .btn-group { display:flex; gap:10px; margin-bottom:12px; }
    .btn-group .btn { flex:1; margin-top:0; }
    .btn-disabled { background:#f5f5f5!important; border-color:#ddd!important; color:#aaa!important; cursor:not-allowed!important; }
    #student-list { margin-top:15px; padding:15px; border-radius:10px; background:#e8f5e9; display:none; }
    .footer { margin-top:30px; font-size:.85em; color:#7f8c8d; text-align:center; }
    .pdf-loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, 0.85); display: none; justify-content: center; align-items: center; z-index: 9999; text-align: center; }
    .pdf-spinner-text { font-size: 1.1em; font-weight: bold; color: var(--text-main); background: white; padding: 25px 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 2px solid var(--primary-color); line-height: 1.5; }
    
    /* 🌟 신규: 명단 관리 모달 CSS (기존 디자인 테마 완벽 유지) */
    .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); display:none; justify-content:center; align-items:center; z-index:9990; }
    .modal-content { background:white; padding:25px; border-radius:15px; width:90%; max-width:600px; max-height:85vh; overflow-y:auto; box-shadow:0 8px 30px rgba(0,0,0,0.2); }
    .modal-header { display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--primary-color); padding-bottom:10px; margin-bottom:15px; }
    .modal-title { font-size:1.2em; font-weight:bold; color:var(--text-main); margin:0; }
    .close-btn { background:none; border:none; font-size:1.5em; cursor:pointer; color:#777; font-weight:bold; }
    .form-group { display:flex; gap:8px; margin-bottom:15px; flex-wrap:wrap; background:#f9f9f9; padding:15px; border-radius:10px; border:1px solid #ddd; align-items:center; }
    .form-group input, .form-group select { padding:10px; border:1px solid #ccc; border-radius:8px; flex:1; min-width:80px; font-size:0.95em; }
    .manage-table { width:100%; border-collapse:collapse; font-size:0.9em; margin-top:10px; }
    .manage-table th, .manage-table td { border:1px solid #c8e6c9; padding:10px 5px; text-align:center; }
    .manage-table th { background-color:#e8f5e9; color:var(--text-main); }
    .action-btn { padding:6px 8px; font-size:0.85em; border:none; border-radius:5px; cursor:pointer; color:white; font-weight:bold; margin:2px; }
    .btn-edit-small { background-color:#f5b041; }
    .btn-del-small { background-color:#e57373; }
  </style>
</head>
<body>
  <div id="pdf-loading" class="pdf-loading-overlay">
    <div class="pdf-spinner-text">학생 QR코드 PDF를 생성 중입니다.<br>잠시만 기다려주세요... ⏳</div>
  </div>

  <div class="container" id="login-screen">
    <h1>서현고등학교<br>꿈꾸는 글마루 출석관리 시스템</h1>
    <div class="notice">출석 인정 시간<br>1교시 18:00~19:40 / 2교시 20:40~21:40</div>
    <div class="login-form">
      <input type="text" id="login-id" placeholder="아이디 (admin 또는 교사 이름)" autocomplete="off">
      <input type="password" id="login-pw" placeholder="비밀번호">
      <button type="button" class="btn btn-solid" onclick="login()">로그인</button>
    </div>
  </div>

  <div class="container" id="main-screen" style="display:none; max-width:500px;">
    <div class="clock-container">
      <div id="current-date" class="date-text"></div>
      <div id="current-time" class="time-text"></div>
    </div>
    <div class="notice">출석 인정 시간<br>1교시 18:00~19:40 / 2교시 20:40~21:40</div>
    
    <button class="btn btn-outline" style="background:#e8f5e9; border-color:#4caf50; margin-bottom: 12px;" onclick="location.href='dashboard.html'">📊 기간별 통계 및 출석부 인쇄</button>
    
    <div class="btn-group">
      <button class="btn btn-outline" onclick="downloadTemplate()">📥 양식 다운로드</button>
      <button class="btn btn-outline" onclick="downloadExistingRoster()">📋 명단 다운로드</button>
    </div>
    
    <div class="btn-group">
      <label class="btn btn-outline" id="upload-btn" for="excel-upload">📤 명단 업로드</label>
      <input type="file" id="excel-upload" accept=".xlsx,.xls,.csv" style="display:none;">
      <button class="btn btn-danger" id="delete-all-btn" onclick="deleteExistingRoster()">🗑️ 명단 초기화</button>
    </div>

    <!-- 🌟 신규: 명단 개별 관리 버튼 (관리자에게만 노출) -->
    <div class="btn-group" id="admin-manage-group" style="display:none;">
      <button class="btn btn-outline" style="border-color:#f5b041; color:#d68910;" onclick="openManageModal()">👨‍🔧 학생 명단 개별 관리 (추가/수정/삭제)</button>
    </div>

    <div class="btn-group">
      <button class="btn btn-outline" style="border-color:#1976d2; color:#1976d2;" onclick="downloadTeacherQR()">👨‍🏫 감독교사 인증 QR</button>
      <button class="btn btn-solid" id="pdf-btn" disabled onclick="generatePDF()">🖨️ 학생 QR 다운로드</button>
    </div>
    <button class="btn btn-outline" onclick="logout()" style="margin-top:10px;">로그아웃</button>
    
    <div id="student-list"></div>
  </div>

  <!-- 🌟 신규: 학생 관리 모달창 -->
  <div id="manage-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">📋 학생 명단 개별 관리</h3>
        <button class="close-btn" onclick="closeManageModal()">&times;</button>
      </div>
      
      <!-- 입력 폼 -->
      <div class="form-group">
        <input type="text" id="m-id" placeholder="학번 (예: 10101)">
        <input type="text" id="m-name" placeholder="이름 (예: 홍길동)">
        <select id="m-day">
          <option value="월">월</option><option value="화">화</option><option value="수">수</option>
          <option value="목">목</option><option value="금">금</option>
        </select>
        <select id="m-p1" title="1교시 제외 여부">
          <option value="">1교시(참여)</option><option value="제외">1교시(제외)</option>
        </select>
        <select id="m-p2" title="2교시 제외 여부">
          <option value="">2교시(참여)</option><option value="제외">2교시(제외)</option>
        </select>
        <button class="btn btn-solid" style="min-height:40px; margin:0; width:100%;" onclick="saveStudent()">저장 (추가/수정)</button>
        <button class="btn btn-outline" style="min-height:40px; margin:0; width:100%; border:none; background:#eee;" onclick="clearManageForm()">입력창 초기화</button>
      </div>

      <!-- 학생 목록 테이블 -->
      <div style="overflow-x:auto;">
        <table class="manage-table">
          <thead><tr><th>학번</th><th>이름</th><th>요일</th><th>1교시</th><th>2교시</th><th>관리</th></tr></thead>
          <tbody id="manage-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="footer">Copyright 2026. 서현고등학교 All Rights Reserved.</div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzjDSKEEcwfST6HRxOsQdARUOvhdM8VWUeqTetrcoIDV8_IvrTRHJkgJl9BvLuhd78l/exec";
    let studentsData = [];
    
    window.onload = function() {
      const pwInput = document.getElementById("login-pw");
      const idInput = document.getElementById("login-id");
      if(pwInput) pwInput.addEventListener("keyup", (e) => { if(e.key === "Enter") login(); });
      if(idInput) idInput.addEventListener("keyup", (e) => { if(e.key === "Enter") login(); });
      if (sessionStorage.getItem("userRole")) {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("main-screen").style.display = "block";
        applyRoleUI(sessionStorage.getItem("userRole"));
        setInterval(updateClock, 1000);
        updateClock();
        loadExistingStudents();
      }
    };
    
    function updateClock() {
      const now = new Date();
      const d = ["일","월","화","수","목","금","토"];
      document.getElementById("current-date").innerText =
        `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 (${d[now.getDay()]}요일)`;
      document.getElementById("current-time").innerText =
        now.toLocaleTimeString("ko-KR", { hour12:true, hour:"2-digit", minute:"2-digit", second:"2-digit" });
    }
    
    function applyRoleUI(role) {
      const delBtn = document.getElementById("delete-all-btn");
      const uploadBtn = document.getElementById("upload-btn");
      const manageGroup = document.getElementById("admin-manage-group"); // 관리자 관리 버튼
      
      if (role === "admin") {
        delBtn.disabled = false;
        delBtn.classList.remove("btn-disabled");
        if (uploadBtn) {
          uploadBtn.classList.remove("btn-disabled");
          uploadBtn.style.pointerEvents = "auto";
        }
        if (manageGroup) manageGroup.style.display = "flex";
      } else {
        delBtn.disabled = true;
        delBtn.classList.add("btn-disabled");
        delBtn.innerText = "🚫 관리자전용";
        if (uploadBtn) {
          uploadBtn.classList.add("btn-disabled");
          uploadBtn.innerText = "🚫 관리자전용";
          uploadBtn.style.pointerEvents = "none";
        }
        if (manageGroup) manageGroup.style.display = "none";
      }
    }
    
    function login() {
      const id = document.getElementById("login-id").value.trim();
      const pw = document.getElementById("login-pw").value.trim();
      if (!id || !pw) {
        alert("아이디와 비밀번호를 모두 입력해주세요.");
        return;
      }
      if (id === "admin" && pw === "7895301") {
        sessionStorage.setItem("userRole", "admin");
        sessionStorage.setItem("teacherName", "관리자(admin)");
        location.reload();
        return;
      }
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const todayString = `${yyyy}${mm}${dd}`;
      if (pw === todayString) {
        sessionStorage.setItem("userRole", "supervisor");
        sessionStorage.setItem("teacherName", id);
        location.reload();
      } else {
        alert("아이디 또는 비밀번호가 올바르지 않습니다.");
      }
    }
    
    function logout() {
      if (!confirm("로그아웃하시겠습니까?")) return;
      sessionStorage.removeItem("userRole");
      sessionStorage.removeItem("teacherName");
      location.reload();
    }
    
    async function loadExistingStudents() {
      try {
        const res = await fetch(`${API_URL}?action=getStudents`);
        const data = await res.json();
        studentsData = Array.isArray(data) ? data : (data.list || []);
        if (studentsData.length > 0) {
          const dayCounts = { "월": 0, "화": 0, "수": 0, "목": 0, "금": 0, "토": 0, "일": 0 };
          studentsData.forEach(s => {
            if (s.day && dayCounts[s.day] !== undefined) {
              dayCounts[s.day]++;
            }
          });
          const daysOrder = ["월", "화", "수", "목", "금", "토", "일"];
          let summaryParts = [];
          daysOrder.forEach(day => {
            if (dayCounts[day] > 0) {
              summaryParts.push(`<b>${day}</b>: ${dayCounts[day]}명`);
            }
          });
          const daySummaryText = summaryParts.length > 0 ? summaryParts.join(' &nbsp;|&nbsp; ') : '요일 정보 없음';
          document.getElementById("student-list").innerHTML =
            `<div style="font-weight:bold; font-size:1.1em; color:var(--text-main); margin-bottom:5px;">
              ✅ ${studentsData.length}건 로드 완료
             </div>
             <div style="font-size:0.9em; color:#555; margin-bottom:10px;">
              최근 업데이트: ${data.lastUploadTime || "기록 없음"}
             </div>
             <div style="background:#fff; padding:10px; border-radius:8px; font-size:0.95em; color:var(--primary-dark); border:1px solid #c8e6c9;">
               ${daySummaryText}
             </div>`;
          document.getElementById("student-list").style.display = "block";
          document.getElementById("pdf-btn").disabled = false;
        }
      } catch (e) {
        alert("학생명단을 불러오지 못했습니다.");
      }
    }
    
    async function deleteExistingRoster() {
      if (sessionStorage.getItem("userRole") !== "admin") return alert("관리자 권한이 없습니다.");
      if (!confirm("학생명단만 초기화됩니다. 기존 출결기록은 유지됩니다. 계속하시겠습니까?")) return;
      await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "resetRosterOnly" }) });
      location.reload();
    }
    
    /* 🌟 신규: 모달 관련 함수 */
    function openManageModal() {
      document.getElementById("manage-modal").style.display = "flex";
      renderManageTable();
    }
    
    function closeManageModal() {
      document.getElementById("manage-modal").style.display = "none";
      clearManageForm();
    }

    function clearManageForm() {
      document.getElementById("m-id").value = "";
      document.getElementById("m-id").readOnly = false;
      document.getElementById("m-id").style.backgroundColor = "#fff";
      document.getElementById("m-name").value = "";
      document.getElementById("m-day").value = "월";
      document.getElementById("m-p1").value = "";
      document.getElementById("m-p2").value = "";
    }

    function renderManageTable() {
      const tbody = document.getElementById("manage-tbody");
      tbody.innerHTML = "";
      
      let sortedList = [...studentsData].sort((a,b) => String(a.id).localeCompare(String(b.id)));
      
      sortedList.forEach(st => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${st.id}</td>
          <td><b>${st.name}</b></td>
          <td>${st.day}</td>
          <td style="color:${st.p1_exc==='제외'?'#e57373':''}">${st.p1_exc || '-'}</td>
          <td style="color:${st.p2_exc==='제외'?'#e57373':''}">${st.p2_exc || '-'}</td>
          <td>
            <button class="action-btn btn-edit-small" onclick="editStudent('${st.id}','${st.name}','${st.day}','${st.p1_exc||''}','${st.p2_exc||''}')">수정</button>
            <button class="action-btn btn-del-small" onclick="deleteStudent('${st.id}','${st.name}')">삭제</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function editStudent(id, name, day, p1, p2) {
      document.getElementById("m-id").value = id;
      document.getElementById("m-id").readOnly = true; // 수정모드시 학번 변경 불가
      document.getElementById("m-id").style.backgroundColor = "#eee";
      document.getElementById("m-name").value = name;
      document.getElementById("m-day").value = day;
      document.getElementById("m-p1").value = p1;
      document.getElementById("m-p2").value = p2;
    }

    function saveStudent() {
      const id = document.getElementById("m-id").value.trim();
      const name = document.getElementById("m-name").value.trim();
      const day = document.getElementById("m-day").value;
      const p1 = document.getElementById("m-p1").value;
      const p2 = document.getElementById("m-p2").value;

      if(!id || !name) return alert("학번과 이름을 모두 입력해주세요.");

      const btn = event.target;
      btn.innerText = "처리 중...";
      btn.disabled = true;

      const url = `${API_URL}?${new URLSearchParams({
        action: 'manageStudent', mode: 'save', id: id, name: name, day: day, p1_exc: p1, p2_exc: p2
      }).toString()}`;

      fetch(url)
        .then(res => res.json())
        .then(res => {
          if (res.success) {
            alert(res.message);
            clearManageForm();
            loadExistingStudents().then(() => renderManageTable());
          } else {
            alert("오류: " + res.message);
          }
        })
        .finally(() => {
          btn.innerText = "저장 (추가/수정)";
          btn.disabled = false;
        });
    }

    function deleteStudent(id, name) {
      if(!confirm(`[${id} ${name}] 학생을 명단에서 완전히 삭제하시겠습니까?`)) return;

      const url = `${API_URL}?${new URLSearchParams({
        action: 'manageStudent', mode: 'delete', id: id
      }).toString()}`;

      fetch(url)
        .then(res => res.json())
        .then(res => {
          if (res.success) {
            alert(res.message);
            loadExistingStudents().then(() => renderManageTable());
          } else {
            alert("삭제 실패: " + res.message);
          }
        });
    }

    /* --- 이하 기존 엑셀/PDF 로직 --- */
    function downloadTemplate() {
      const wb = XLSX.utils.book_new();
      ["월","화","수","목","금"].forEach(day => {
        const rows = [
          [`26 꿈꾸는 글마루 명단(${day}요일)`, "", "", "", ""],
          ["", "", "", "", ""],
          ["학년", "학번", "이름", "1교시", "2교시"],
          ["1", "10114", "박하린", "", ""],
          ["1", "10207", "노혜나", "", "제외"]
        ];
        const ws = XLSX.utils.aoa_to_sheet(rows);
        ws["!merges"] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 4 } }];
        XLSX.utils.book_append_sheet(wb, ws, day);
      });
      XLSX.writeFile(wb, "글마루_업로드_양식.xlsx");
    }
    
    function downloadExistingRoster() {
      if (studentsData.length === 0) return alert("다운로드할 명단이 없습니다.");
      const wb = XLSX.utils.book_new();
      ["월","화","수","목","금"].forEach(day => {
        const wsData = [
          [`26 꿈꾸는 글마루 명단(${day}요일)`, "", "", "", ""],
          ["", "", "", "", ""],
          ["학년", "학번", "이름", "1교시", "2교시"]
        ];
        studentsData
          .filter(s => s.day === day)
          .sort((a,b) => String(a.id).localeCompare(String(b.id)))
          .forEach(s => {
            const grade = String(s.id).substring(0, 1);
            wsData.push([grade, s.id, s.name, s.p1_exc || "", s.p2_exc || ""]);
          });
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        ws["!merges"] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 4 } }];
        XLSX.utils.book_append_sheet(wb, ws, day);
      });
      XLSX.writeFile(wb, "현재_출석명단.xlsx");
    }
    
    document.getElementById("excel-upload").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(ev) {
        try {
          const wb = XLSX.read(new Uint8Array(ev.target.result), { type:"array" });
          studentsData = [];
          wb.SheetNames.forEach(sn => {
            const sheet = wb.Sheets[sn];
            const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            if (json.length === 0) return;
            let sheetDay = "공통";
            const dayMatch = sn.match(/[월화수목금토일]/);
            if (dayMatch) {
              sheetDay = dayMatch[0];
            } else {
              const firstRowText = json.length > 0 ? String(json[0].join("")) : "";
              const titleMatch = firstRowText.match(/[월화수목금토일]/);
              if (titleMatch) sheetDay = titleMatch[0];
            }
            let colId = -1, colName = -1, colP1 = -1, colP2 = -1;
            for (let i = 0; i < Math.min(json.length, 10); i++) {
              const row = json[i];
              if (!row) continue;
              for (let j = 0; j < row.length; j++) {
                const val = String(row[j] || "").replace(/\s+/g, "");
                if (val.includes("학번")) colId = j;
                if (val.includes("이름") || val.includes("성명")) colName = j;
                if (val.includes("1교시")) colP1 = j;
                if (val.includes("2교시")) colP2 = j;
              }
              if (colId !== -1 && colName !== -1) break;
            }
            for (let i = 0; i < json.length; i++) {
              const row = json[i];
              if (!row || row.length < 2) continue;
              let foundId = "", foundName = "", isP1Exc = "", isP2Exc = "";
              if (colId !== -1 && colName !== -1) {
                const idVal = String(row[colId] || "").replace(/\s+/g, "");
                const nameVal = String(row[colName] || "").trim();
                if (idVal.match(/^\d{4,5}$/) && nameVal && !nameVal.includes("이름")) {
                  foundId = idVal;
                  foundName = nameVal;
                  if (colP1 !== -1) {
                    const p1Mark = String(row[colP1] || "").trim();
                    isP1Exc = (p1Mark !== "") ? "제외" : "";
                  }
                  if (colP2 !== -1) {
                    const p2Mark = String(row[colP2] || "").trim();
                    isP2Exc = (p2Mark !== "") ? "제외" : "";
                  }
                  studentsData.push({ id: foundId, name: foundName, day: sheetDay, p1_exc: isP1Exc, p2_exc: isP2Exc });
                  continue;
                }
              }
              if (!foundId) {
                let idColIndex = -1;
                for (let j = 0; j < row.length; j++) {
                  const cellVal = String(row[j] || "").replace(/\s+/g, "");
                  const idMatch = cellVal.match(/\d{4,5}/);
                  if (idMatch && cellVal.length <= 6) {
                    foundId = idMatch[0];
                    idColIndex = j;
                    break;
                  }
                }
                if (foundId && idColIndex !== -1) {
                  for (let k = idColIndex + 1; k < row.length; k++) {
                    const nextCell = String(row[k] || "").trim();
                    if (nextCell && !nextCell.includes("이름") && nextCell.length >= 2 && /[가-힣a-zA-Z]/.test(nextCell)) {
                      foundName = nextCell;
                      const p1Mark = String(row[k+1] || "").trim();
                      const p2Mark = String(row[k+2] || "").trim();
                      isP1Exc = (p1Mark !== "") ? "제외" : "";
                      isP2Exc = (p2Mark !== "") ? "제외" : "";
                      studentsData.push({ id: foundId, name: foundName, day: sheetDay, p1_exc: isP1Exc, p2_exc: isP2Exc });
                      break;
                    }
                  }
                }
              }
            }
          });
          if (studentsData.length === 0) {
            alert("업로드할 학생 데이터가 없습니다.\n(원인: 엑셀 파일 내에서 학번과 이름 패턴을 전혀 찾지 못했습니다. 엑셀의 빈 셀 병합이나 서식을 확인해주세요.)");
            e.target.value = '';
            return;
          }
          const idCounts = {};
          studentsData.forEach(s => {
            idCounts[s.id] = (idCounts[s.id] || 0) + 1;
          });
          const duplicates = Object.keys(idCounts).filter(id => idCounts[id] > 1);
          if (duplicates.length > 0) {
            const dupMsg = duplicates.map(id => `${id}(${idCounts[id]}번)`).join(", ");
            const confirmMsg = `⚠️ 엑셀 명단에 중복된 학번이 발견되었습니다.\n\n[중복 학번]\n${dupMsg}\n\n* 학생이 여러 요일에 출석하는 경우 중복 표시될 수 있습니다.\n이대로 명단 업로드를 진행하시겠습니까?`;
            if (!confirm(confirmMsg)) {
              e.target.value = '';
              return;
            }
          }
          document.getElementById("student-list").style.display = "block";
          document.getElementById("student-list").innerHTML = `⏳ 데이터를 서버로 전송 중입니다... (${studentsData.length}명)`;
          await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({
              action: "uploadStudents",
              students: studentsData
            })
          });
          alert(`${studentsData.length}건의 명단을 정상적으로 업로드했습니다.`);
          location.reload();
        } catch (error) {
          alert("명단 업로드 중 오류가 발생했습니다: " + error.message);
        }
      };
      reader.readAsArrayBuffer(file);
      e.target.value = '';
    });
    
    function getBaseUrl() {
      return location.href.substring(0, location.href.lastIndexOf("/") + 1);
    }
    
    function downloadTeacherQR() {
      const baseUrl = getBaseUrl();
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF("p", "mm", "a4");
      const qrDiv = document.createElement("div");
      new QRCode(qrDiv, {
        text: `${baseUrl}scan.html`,
        width: 256,
        height: 256,
        colorDark: "#1976d2",
        correctLevel: QRCode.CorrectLevel.H
      });
      setTimeout(() => {
        const canvas = document.createElement("canvas");
        canvas.width = 350;
        canvas.height = 420;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, 350, 420);
        ctx.fillStyle = "#1976d2";
        ctx.font = "bold 24px Noto Sans KR";
        ctx.textAlign = "center";
        ctx.fillText("감독교사 로그인 QR", 175, 50);
        ctx.drawImage(qrDiv.querySelector("canvas"), 47, 90);
        ctx.font = "bold 14px Noto Sans KR";
        ctx.fillText("1교시 18:00~19:40 / 2교시 20:40~21:40", 175, 380);
        pdf.addImage(canvas.toDataURL("image/png"), "PNG", 45, 25, 120, 145);
        pdf.save("감독교사_전용QR.pdf");
      }, 100);
    }
    
    async function generatePDF() {
      if (studentsData.length === 0) return alert("학생명단이 없습니다.");
      document.getElementById("pdf-loading").style.display = "flex";
      await new Promise(r => setTimeout(r, 100));
      try {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF("p", "mm", "a4");
        const baseUrl = getBaseUrl();
        const uniqueMap = new Map();
        const dayOrder = { "월": 1, "화": 2, "수": 3, "목": 4, "금": 5, "토": 6, "일": 7 };
        studentsData.forEach(s => {
          if (uniqueMap.has(s.id)) {
            const ex = uniqueMap.get(s.id);
            let days = ex.day.split(", ").map(d => d.trim());
            if (!days.includes(s.day)) {
              days.push(s.day);
            }
            days.sort((a, b) => (dayOrder[a] || 99) - (dayOrder[b] || 99));
            ex.day = days.join(", ");
          } else {
            uniqueMap.set(s.id, { ...s });
          }
        });
        const finalList = Array.from(uniqueMap.values())
          .sort((a,b) => String(a.id).localeCompare(String(b.id)));
        for (let i = 0; i < finalList.length; i++) {
          const s = finalList[i];
          const qrDiv = document.createElement("div");
          new QRCode(qrDiv, {
            text: `${baseUrl}scan.html?id=${encodeURIComponent(s.id)}`,
            width: 256,
            height: 256,
            colorDark: "#33691e",
            correctLevel: QRCode.CorrectLevel.H
          });
          await new Promise(r => setTimeout(r, 40));
          const canvas = document.createElement("canvas");
          canvas.width = 256;
          canvas.height = 340;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, 256, 340);
          ctx.drawImage(qrDiv.querySelector("canvas"), 0, 0);
          ctx.fillStyle = "#33691e";
          ctx.textAlign = "center";
          ctx.font = "bold 25px Noto Sans KR";
          ctx.fillText(`${s.id} ${s.name}`, 128, 285);
          ctx.font = "bold 18px Noto Sans KR";
          ctx.fillText(`(${s.day})`, 128, 315);
          pdf.addImage(
            canvas.toDataURL("image/png"),
            "PNG",
            20 + (i % 3) * 60,
            20 + Math.floor((i % 9) / 3) * 82,
            45,
            60
          );
          if ((i + 1) % 9 === 0 && i < finalList.length - 1) {
            pdf.addPage();
          }
        }
        pdf.save("학생_QR명단.pdf");
      } catch (error) {
        alert("PDF 생성 중 오류가 발생했습니다: " + error.message);
      } finally {
        document.getElementById("pdf-loading").style.display = "none";
      }
    }
  </script>
