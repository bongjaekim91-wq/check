<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 출석 QR 발급받기 - 꿈꾸는 글마루</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --primary-color:#81c784; --primary-dark:#33691e; --bg-color:#f1f8e9; }
    body { font-family:'Noto Sans KR',sans-serif; background:var(--bg-color); margin:0; padding:20px; display:flex; justify-content:center; align-items:center; min-height:100vh; color:var(--primary-dark); }
    .container { background:white; padding:30px 20px; border-radius:20px; box-shadow:0 8px 30px rgba(85,139,47,.15); width:100%; max-width:350px; text-align:center; box-sizing:border-box; }
    h1 { font-size:1.3em; margin-bottom:20px; line-height:1.4; }
    .input-group { display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
    input[type="text"] { padding:15px; font-size:1em; border:2px solid #c8e6c9; border-radius:10px; outline:none; text-align:center; }
    input[type="text"]:focus { border-color:var(--primary-color); }
    .btn { padding:15px; font-size:1.1em; font-weight:bold; border-radius:10px; cursor:pointer; width:100%; border:none; transition:.2s; background:var(--primary-color); color:white; }
    .btn:active { background:var(--primary-dark); }
    
    #result-area { display:none; margin-top:20px; padding-top:20px; border-top:2px dashed #c8e6c9; }
    .instruction { font-size:0.9em; color:#e53935; font-weight:bold; margin-bottom:15px; }
    #final-image { width:100%; max-width:250px; border-radius:10px; box-shadow:0 4px 15px rgba(0,0,0,0.1); margin-bottom:15px; }
    
    .btn-download { background:#1976d2; margin-bottom:10px; }
    .btn-reset { background:#f5f5f5; color:#555; border:1px solid #ddd; }
  </style>
</head>
<body>

  <div class="container" id="input-step">
    <h1>📱 꿈꾸는 글마루<br>내 출석 QR코드 발급</h1>
    <p style="font-size:0.9em; color:#555; margin-bottom:20px;">본인의 학번과 이름을 정확히 입력하세요.</p>
    
    <div class="input-group">
      <input type="text" id="student-id" placeholder="학번 입력 (예: 10101)" inputmode="numeric">
      <input type="text" id="student-name" placeholder="이름 입력 (예: 홍길동)">
    </div>
    <button class="btn" onclick="generateStudentQR()">QR코드 발급받기</button>
  </div>

  <div class="container" id="result-step" style="display:none;">
    <h1>🎉 발급 완료!</h1>
    <p class="instruction">👇 아래 이미지를 '꾹 눌러서' 스마트폰 사진첩에 저장하세요.</p>
    
    <!-- 완성된 이미지가 보여질 곳 -->
    <img id="final-image" alt="내 출석 QR코드">
    
    <a id="download-link" download="내_출석_QR코드.png" style="text-decoration:none;">
      <button class="btn btn-download">📥 이미지 다운로드</button>
    </a>
    <button class="btn btn-reset" onclick="resetPage()">다시 발급하기</button>
  </div>

  <!-- QR코드 생성을 위한 임시 공간 (화면엔 안보임) -->
  <div id="temp-qr" style="display:none;"></div>

  <script>
    function generateStudentQR() {
      const id = document.getElementById("student-id").value.trim();
      const name = document.getElementById("student-name").value.trim();

      if (!id || !name) {
        alert("학번과 이름을 모두 입력해주세요.");
        return;
      }

      // 버튼 텍스트 변경
      const btn = document.querySelector("#input-step .btn");
      btn.innerText = "생성 중...";
      btn.disabled = true;

      // 1. 현재 접속한 주소를 기반으로 스캔용 주소 생성
      // 예: 학생이 접속한 주소가 https://내도메인/student.html 이라면
      // 스캔 주소는 https://내도메인/scan.html?id=학번 이 되어야 함
      const currentUrl = location.href.split('?')[0]; 
      const baseUrl = currentUrl.substring(0, currentUrl.lastIndexOf("/") + 1);
      const scanUrl = `${baseUrl}scan.html?id=${encodeURIComponent(id)}`;

      // 2. 임시 QR코드 생성
      const tempQrDiv = document.getElementById("temp-qr");
      tempQrDiv.innerHTML = ""; // 초기화
      new QRCode(tempQrDiv, {
        text: scanUrl,
        width: 256,
        height: 256,
        colorDark: "#33691e",
        correctLevel: QRCode.CorrectLevel.H
      });

      // 3. QR코드가 그려질 시간을 아주 잠깐 기다린 후 캔버스에 합성
      setTimeout(() => {
        const canvas = document.createElement("canvas");
        canvas.width = 320;
        canvas.height = 420;
        const ctx = canvas.getContext("2d");

        // 배경 흰색
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, 320, 420);

        // 상단 타이틀
        ctx.fillStyle = "#33691e";
        ctx.textAlign = "center";
        ctx.font = "bold 20px Noto Sans KR";
        ctx.fillText("꿈꾸는글마루 출석 QR코드", 160, 45);

        // QR코드 이미지 합치기
        const qrCanvas = tempQrDiv.querySelector("canvas");
        if(qrCanvas) {
          ctx.drawImage(qrCanvas, 32, 65, 256, 256); // 가운데 정렬
        }

        // 하단 학번 이름
        ctx.font = "bold 30px Noto Sans KR";
        ctx.fillText(`${id} ${name}`, 160, 375);

        // 4. 캔버스를 이미지 URL로 변환하여 화면에 표시
        const finalImgUrl = canvas.toDataURL("image/png");
        document.getElementById("final-image").src = finalImgUrl;
        document.getElementById("download-link").href = finalImgUrl;
        
        // 다운로드 파일명 지정
        document.getElementById("download-link").download = `글마루_QR_${id}_${name}.png`;

        // 화면 전환
        document.getElementById("input-step").style.display = "none";
        document.getElementById("result-step").style.display = "block";
        
        btn.innerText = "QR코드 발급받기";
        btn.disabled = false;

      }, 300); // 0.3초 대기
    }

    function resetPage() {
      document.getElementById("student-id").value = "";
      document.getElementById("student-name").value = "";
      document.getElementById("result-step").style.display = "none";
      document.getElementById("input-step").style.display = "block";
    }
  </script>
</body>
</html>
