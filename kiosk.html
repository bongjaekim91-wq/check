<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>꿈꾸는 글마루 출결 키오스크</title>
  <style>
    body { font-family: 'Pretendard', sans-serif; background-color: #2b4b73; margin: 0; padding: 0; color: white; text-align: center; overflow: hidden; }
    .header { margin-top: 80px; font-size: 2.5em; font-weight: bold; letter-spacing: 2px; }
    .clock { font-size: 4em; font-weight: 900; margin: 20px 0; color: #ffeb3b; text-shadow: 2px 2px 8px rgba(0,0,0,0.3); }
    .instruction { font-size: 1.5em; margin-bottom: 40px; color: #bbdefb; }
    .scanner-box { background: white; width: 400px; height: 300px; margin: 0 auto; border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
    .scanner-box img { width: 120px; opacity: 0.8; margin-bottom: 20px; }
    .scanner-box p { color: #333; font-size: 1.2em; font-weight: bold; margin: 0; }
    
    /* ★ 수정 요청 사항 반영: 바코드 리더기 영문 입력 유도 */
    #scanner-input {
      width: 0; height: 0; opacity: 0; position: absolute;
      ime-mode: inactive; 
    }
    
    .popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; display: none; }
    .popup-content { background: white; color: #333; padding: 50px 80px; border-radius: 30px; font-size: 2.5em; font-weight: bold; text-align: center; box-shadow: 0 10px 50px rgba(0,0,0,0.5); animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .popup.success .popup-content { border: 8px solid #4caf50; }
    .popup.error .popup-content { border: 8px solid #f44336; }
    .popup-icon { font-size: 3em; margin-bottom: 20px; }
    
    /* ★ 신규: 무단결석 누적 경고 박스 */
    .absence-warning { margin-top: 30px; background-color: #ffebee; border: 4px solid #d32f2f; border-radius: 15px; padding: 25px; color: #c62828; font-size: 0.65em; line-height: 1.4; display: none; }
    
    @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    #status-indicator { position: absolute; bottom: 20px; right: 20px; font-size: 1em; color: rgba(255,255,255,0.5); }
  </style>
</head>
<body>
  <div class="header">📚 꿈꾸는 글마루 출석 스캐너</div>
  <div class="clock" id="clock">00:00:00</div>
  <div class="instruction">바코드 리더기에 학생증 또는 QR코드를 스캔하세요.</div>
  
  <div class="scanner-box" onclick="document.getElementById('scanner-input').focus()">
    <img src="https://cdn-icons-png.flaticon.com/512/248/248324.png" alt="QR Scan">
    <p>여기를 클릭한 후 스캔하세요</p>
    <input type="text" id="scanner-input" autocomplete="off" autofocus>
  </div>
  
  <div id="status-indicator">● 대기 중</div>

  <div class="popup" id="popup">
    <div class="popup-content" id="popup-box">
      <div class="popup-icon" id="popup-icon">✅</div>
      <div id="popup-msg">홍길동 학생<br>출석 완료</div>
      <!-- ★ 무단결석 경고창 추가 -->
      <div class="absence-warning" id="absence-warning"></div>
    </div>
  </div>

  <script>
    // ★ API URL을 구글 앱스 스크립트 배포 URL로 변경하세요.
    const API_URL = "https://script.google.com/macros/s/AKfycbzjDSKEEcwfST6HRxOsQdARUOvhdM8VWUeqTetrcoIDV8_IvrTRHJkgJl9BvLuhd78l/exec";
    const inputField = document.getElementById('scanner-input');
    let isProcessing = false;

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('ko-KR', { hour12: false });
    }
    setInterval(updateClock, 1000); updateClock();
    
    document.addEventListener('click', () => inputField.focus());
    inputField.addEventListener('blur', () => setTimeout(() => inputField.focus(), 10));

    inputField.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const rawData = inputField.value.trim();
        inputField.value = '';
        if (rawData !== "" && !isProcessing) processScan(rawData);
      }
    });

    function processScan(data) {
      isProcessing = true;
      document.getElementById('status-indicator').innerText = "🟡 서버 통신 중...";
      document.getElementById('status-indicator').style.color = "#ffeb3b";
      
      let studentId = data; let studentName = "";
      if (data.startsWith('http')) {
        try {
          let url = new URL(data);
          studentId = url.searchParams.get('id') || url.searchParams.get('stuno') || data;
          studentName = url.searchParams.get('name') || "";
        } catch(e) {}
      }
      
      const targetUrl = `${API_URL}?action=scan&id=${encodeURIComponent(studentId)}&name=${encodeURIComponent(studentName)}`;
      
      fetch(targetUrl)
        .then(res => res.json())
        .then(res => showPopup(res.success, res.message, res.absenceCount))
        .catch(err => showPopup(false, "서버 연결 오류\n인터넷을 확인하세요.", 0));
    }

    // ★ 수정: absenceCount를 받아 무단결석 경고 출력
    function showPopup(isSuccess, message, absenceCount) {
      const popup = document.getElementById('popup');
      const popupBox = document.getElementById('popup-box');
      const warningBox = document.getElementById('absence-warning');
      
      popup.className = 'popup ' + (isSuccess ? 'success' : 'error');
      document.getElementById('popup-icon').innerText = isSuccess ? '✅' : '❌';
      document.getElementById('popup-msg').innerHTML = message.replace(/\n/g, '<br>');
      
      // ★ 누적 무단결석 팝업 노출 조건 (1회 이상인 경우)
      if (absenceCount && absenceCount > 0) {
        warningBox.innerHTML = `⚠️ <b>현재 무단결석 ${absenceCount}회</b> 입니다.<br>무단결석이 3회가 되면 꿈꾸는 글마루에 참여할 수 없습니다.`;
        warningBox.style.display = "block";
      } else {
        warningBox.style.display = "none";
      }
      
      popup.style.display = 'flex';
      document.getElementById('status-indicator').innerText = "● 대기 중";
      document.getElementById('status-indicator').style.color = "rgba(255,255,255,0.5)";
      
      setTimeout(() => { 
        popup.style.display = 'none'; 
        warningBox.style.display = "none"; // 닫힐때 초기화
        isProcessing = false; 
        inputField.focus(); 
      }, 3500);
    }
  </script>
</body>
</html>
