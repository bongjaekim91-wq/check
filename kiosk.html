<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>꿈꾸는 글마루 출석 스캐너</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --primary-color:#81c784; --bg-color:#f1f8e9; --text-main:#33691e; }
    
    body { font-family:'Noto Sans KR',sans-serif; background:var(--bg-color); margin:0; padding:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; overflow:hidden; box-sizing: border-box; }
    
    .kiosk-container { background:white; padding:40px; border-radius:20px; box-shadow:0 15px 40px rgba(85,139,47,.15); width:100%; max-width:800px; text-align:center; box-sizing:border-box; border: 4px solid var(--primary-color); display: flex; flex-direction: column; }
    
    h1 { font-size:2.5em; color:var(--text-main); margin-bottom: 5px; margin-top: 0; }
    
    .clock-text { font-size: 3.5em; font-weight: 900; color: #2e7d32; margin-bottom: 15px; letter-spacing: 2px; line-height: 1; }
    .date-text { font-size: 1.5em; color: #558b2f; font-weight: 700; margin-bottom: 5px; }
    
    /* 스캐너 입력창 */
    .scanner-box { margin: 20px 0; }
    #scanner-input { padding: 15px; font-size: 1.5em; width: 80%; border: 3px dashed #4caf50; border-radius: 12px; text-align: center; outline: none; background: #e8f5e9; color: #2e7d32; font-weight: bold; }
    #scanner-input:focus { border-style: solid; box-shadow: 0 0 15px rgba(76, 175, 80, 0.4); }
    
    /* 결과 메시지 창 */
    #result-msg { margin-top: 10px; font-size: 1.8em; font-weight: bold; min-height: 70px; display: flex; align-items: center; justify-content: center; border-radius: 15px; padding: 15px; transition: 0.3s; background: #f5f5f5; color: #777; line-height: 1.3; }
    
    .msg-ready { background: #f5f5f5; color: #777; }
    .msg-loading { background: #fffde7; color: #f5b041; border: 2px solid #fff59d; }
    .msg-success { background: #e8f5e9; color: #2e7d32; border: 2px solid #81c784; }
    .msg-error { background: #ffebee; color: #c62828; border: 2px solid #ef9a9a; }
    
    .instruction { font-size: 1.2em; color: #555; font-weight: bold; }

    /* 🌟 실시간 출석 명단 영역 🌟 */
    .recent-list-container { margin-top: 25px; border-top: 2px dashed #c8e6c9; padding-top: 20px; text-align: left; }
    .recent-title { font-size: 1.2em; color: var(--primary-dark); font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .recent-title span { font-size: 0.8em; color: #888; font-weight: normal; }
    
    #recent-list { display: flex; flex-direction: column; gap: 8px; min-height: 150px; }
    
    .recent-item { display: flex; align-items: center; background: #f9fbf9; padding: 12px 20px; border-radius: 10px; border: 1px solid #e0e0e0; font-size: 1.2em; color: #333; animation: slideDown 0.3s ease-out forwards; }
    
    /* 가장 최근 출석한 학생 강조 */
    .recent-item.newest { background: #e8f5e9; border: 2px solid #4caf50; font-weight: bold; color: #1b5e20; transform: scale(1.02); box-shadow: 0 4px 10px rgba(76,175,80,0.2); }
    
    .recent-time { color: #888; font-size: 0.85em; margin-right: 15px; font-weight: normal; }
    .recent-id { color: #1976d2; margin-right: 15px; font-family: monospace; font-size: 1.1em; }
    .recent-name { flex-grow: 1; }
    
    .empty-msg { color: #aaa; text-align: center; margin-top: 40px; font-size: 1.1em; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="kiosk-container">
    <div class="date-text" id="kiosk-date"></div>
    <div class="clock-text" id="kiosk-time"></div>
    
    <h1>📖 글마루 출석 체크</h1>
    <div class="instruction">스캐너 불빛에 QR코드를 비춰주세요</div>
    
    <div class="scanner-box">
      <input type="text" id="scanner-input" placeholder="스캐너 대기 중... (화면 터치 금지)" autocomplete="off" autofocus>
    </div>
    
    <div id="result-msg" class="msg-ready">대기 중... 다음 학생 QR을 스캔하세요</div>

    <!-- 🌟 실시간 출석 명단 UI 🌟 -->
    <div class="recent-list-container">
      <div class="recent-title">
        📋 최근 출석 완료 명단 <span>(최대 5명)</span>
      </div>
      <div id="recent-list">
        <div class="empty-msg">아직 출석한 학생이 없습니다.</div>
      </div>
    </div>
  </div>

  <script>
    // 기존에 사용하시던 구글 앱스 스크립트 주소로 변경 필수!
    const API_URL = "https://script.google.com/macros/s/AKfycbzjDSKEEcwfST6HRxOsQdARUOvhdM8VWUeqTetrcoIDV8_IvrTRHJkgJl9BvLuhd78l/exec";
    
    const inputField = document.getElementById("scanner-input");
    const resultBox = document.getElementById("result-msg");
    const recentListDiv = document.getElementById("recent-list");
    
    let isProcessing = false; 
    let recentStudents = []; // 최근 출석 학생 배열 (최대 5명)
    const MAX_RECENT = 5;

    // 1. 시계 업데이트 로직
    function updateClock() {
      const now = new Date();
      const days = ["일","월","화","수","목","금","토"];
      document.getElementById("kiosk-date").innerText = `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 (${days[now.getDay()]}요일)`;
      document.getElementById("kiosk-time").innerText = now.toLocaleTimeString("ko-KR", { hour12:false, hour:"2-digit", minute:"2-digit", second:"2-digit" });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. 스캐너 포커스 무한 유지 (화면 클릭 방지)
    document.addEventListener("click", () => inputField.focus());
    setInterval(() => { if (document.activeElement !== inputField) inputField.focus(); }, 1000);

    // 3. 스캐너 입력 감지
    inputField.addEventListener("keyup", function(e) {
      if (e.key === "Enter") {
        const rawScanData = this.value.trim();
        this.value = ""; 
        if (!rawScanData) return;
        processScan(rawScanData);
      }
    });

    // 4. 출석 데이터 서버 전송
    function processScan(data) {
      if (isProcessing) return; 
      
      let studentId = "";
      if (data.includes("id=")) {
        try {
          const params = new URLSearchParams(data.substring(data.indexOf("?")));
          studentId = params.get("id");
        } catch (e) { }
      } else {
        studentId = data; 
      }

      if (!studentId || studentId.length < 4) {
        showResult("error", "❌ 유효하지 않은 QR코드입니다.");
        playSound('error');
        return;
      }

      isProcessing = true;
      showResult("loading", `⏳ [${studentId}] 서버 확인 중...`);

      const fetchUrl = `${API_URL}?action=scan&id=${encodeURIComponent(studentId)}`;

      fetch(fetchUrl)
        .then(res => res.json())
        .then(result => {
          if (result.success || result.result === "success") {
             // 성공 메시지 띄우기
             showResult("success", `✅ 출석 완료!\n${result.message || studentId + ' 학생'}`);
             playSound('success');

             // 🌟 하단 실시간 명단에 추가하기 🌟
             // GAS 서버에서 studentName을 안보내주는 경우를 대비해 메시지에서 이름 추출 시도 또는 빈칸 처리
             let sName = result.studentName || result.name || extractNameFromMessage(result.message) || "";
             addRecentStudent(studentId, sName);

          } else {
             showResult("error", `⚠️ 처리 실패\n${result.message || '다시 시도해주세요.'}`);
             playSound('error');
          }
        })
        .catch(err => {
          showResult("error", "❌ 통신 오류! 네트워크를 확인하세요.");
          playSound('error');
        })
        .finally(() => {
          setTimeout(() => {
            showResult("ready", "대기 중... 다음 학생 QR을 스캔하세요");
            isProcessing = false;
          }, 2500); // 2.5초 대기 후 다음 사람 스캔 허용
        });
    }

    // 🌟 실시간 명단 렌더링 함수 🌟
    function addRecentStudent(id, name) {
      const now = new Date();
      const timeStr = now.toLocaleTimeString("ko-KR", { hour12: false, hour:"2-digit", minute:"2-digit", second:"2-digit" });
      
      // 배열의 맨 앞에 새 학생 추가
      recentStudents.unshift({ id: id, name: name, time: timeStr });
      
      // 5명이 넘어가면 맨 마지막(가장 오래된) 데이터 삭제
      if (recentStudents.length > MAX_RECENT) {
        recentStudents.pop(); 
      }
      
      // 화면 업데이트
      renderRecentList();
    }

    function renderRecentList() {
      recentListDiv.innerHTML = ""; // 기존 목록 지우기
      
      recentStudents.forEach((student, index) => {
        const itemDiv = document.createElement("div");
        
        // 방금 찍은(index 0번) 학생은 초록색으로 굵게 강조 (newest 클래스)
        itemDiv.className = "recent-item" + (index === 0 ? " newest" : "");
        
        itemDiv.innerHTML = `
          <span class="recent-time">[${student.time}]</span>
          <span class="recent-id">${student.id}</span>
          <span class="recent-name">${student.name}</span>
          ${index === 0 ? '<span>✅</span>' : ''}
        `;
        recentListDiv.appendChild(itemDiv);
      });
    }

    // (보조함수) 서버 메시지에서 이름만 대충 뽑아내는 함수 (예: "10101 홍길동 학생..." -> "홍길동")
    function extractNameFromMessage(msg) {
      if(!msg) return "";
      const parts = msg.split(" ");
      if(parts.length >= 2) return parts[1].replace("학생", "").trim();
      return "";
    }

    // 결과 화면 UI 변경 함수
    function showResult(type, text) {
      resultBox.className = ""; 
      resultBox.classList.add(`msg-${type}`);
      resultBox.innerHTML = text.replace(/\n/g, "<br>");
    }

    // 경고음/성공음 발생기
    function playSound(type) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gainNode = ctx.createGain();
      osc.connect(gainNode);
      gainNode.connect(ctx.destination);
      
      if (type === 'success') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.5, ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.2);
      } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, ctx.currentTime);
        gainNode.gain.setValueAtTime(0.5, ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.5);
      }
    }
      // =========================================================
  // ★ 키오스크 자동 초기화 (새로고침) 로직 ★
  // 10분(600,000 밀리초) 동안 아무 조작이 없으면 페이지 새로고침
  // =========================================================
  let idleTimer;
  const IDLE_TIMEOUT = 10 * 60 * 1000; // 10분 (원하시면 숫자 10을 변경하세요)

  function resetIdleTimer() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      // 10분간 반응이 없으면 페이지를 완전히 새로고침(초기 상태로 셋팅)
      window.location.reload();
    }, IDLE_TIMEOUT);
  }

  // 화면 터치, 마우스 움직임, 바코드 리더기 입력(키보드 타이핑)이 감지되면 타이머를 연장함
  window.addEventListener('mousemove', resetIdleTimer);
  window.addEventListener('keypress', resetIdleTimer);
  window.addEventListener('touchstart', resetIdleTimer);
  window.addEventListener('click', resetIdleTimer);

  // 페이지가 처음 열렸을 때 타이머 시작
  resetIdleTimer();
  </script>
</body>
</html>
