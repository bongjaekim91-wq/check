<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>꿈꾸는 글마루 결석 신청</title>
  <style>
    /* 기존 스타일 동일 */
    body { font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; background-color: #f0f4f8; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
    .form-container { background: white; padding: 30px 25px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); width: 100%; max-width: 420px; box-sizing: border-box; }
    h2 { color: #2b7a2b; margin-top: 0; text-align: center; border-bottom: 2px solid #e8f5e9; padding-bottom: 15px; font-size: 1.4rem; }
    .notice { background: #fffde7; border: 1px solid #f2e3a8; padding: 15px; border-radius: 8px; font-size: 0.9rem; color: #444; line-height: 1.6; margin-bottom: 20px; }
    .notice ul { margin: 0; padding-left: 20px; }
    .notice li { margin-bottom: 5px; }
    .notice .warning { color: #d32f2f; font-weight: bold; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #333; font-size: 0.95rem; }
    .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ccd1d9; border-radius: 8px; box-sizing: border-box; font-size: 1rem; transition: border-color 0.2s; background: #fdfdfd; }
    .form-group input:focus, .form-group textarea:focus { border-color: #38a169; outline: none; background: #fff; box-shadow: 0 0 0 3px rgba(56,161,105,0.1); }
    .form-group textarea { resize: vertical; height: 90px; }
    #error-msg { color: #e53e3e; background: #fff5f5; border-left: 4px solid #e53e3e; padding: 10px; border-radius: 4px; font-size: 0.9rem; font-weight: bold; margin-bottom: 15px; display: none; }
    .btn-submit { width: 100%; background: #38a169; color: white; padding: 14px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 5px; }
    .btn-submit:hover { background: #2f855a; }
    .btn-submit:disabled { background: #a0aec0; cursor: not-allowed; }
    .shake { animation: shake 0.4s 1; border-color: #e53e3e !important; }
    @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }
    .auto-filled { background-color: #e8f5e9 !important; border-color: #38a169 !important; color: #2b7a2b; font-weight: bold; }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>📩 꿈꾸는글마루 결석 신청</h2>
    <div class="notice">
      <ul>
        <li>결석 신청은 감독 교사의 승인 후 최종 반영됩니다.</li>
        <li class="warning">무단 결석이 3회가 되면 꿈꾸는글마루에 참여할 수 없습니다.</li>
      </ul>
    </div>
    
    <div id="error-msg"></div>
    
    <div class="form-group">
      <label for="req-date">📅 결석 날짜</label>
      <input type="date" id="req-date">
    </div>
    <div class="form-group">
      <label for="req-id">🔢 학번 (5자리 숫자)</label>
      <!-- 데이터를 불러오기 전까지 입력할 수 없도록 disabled 처리 -->
      <input type="tel" id="req-id" placeholder="명단을 불러오는 중입니다..." maxlength="5" autocomplete="off" disabled>
    </div>
    <div class="form-group">
      <label for="req-name">👤 이름</label>
      <input type="text" id="req-name" placeholder="학번을 입력하면 자동으로 나타납니다." maxlength="10" autocomplete="off" readonly>
    </div>
    <div class="form-group">
      <label for="req-reason">📝 결석 사유 (상세히 작성)</label>
      <textarea id="req-reason" placeholder="예: 병원 진료(감기), 가족 행사 등 구체적으로 적어주세요."></textarea>
    </div>
    <button id="submit-btn" class="btn-submit" onclick="submitAbsence()">신청서 제출하기</button>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzjDSKEEcwfST6HRxOsQdARUOvhdM8VWUeqTetrcoIDV8_IvrTRHJkgJl9BvLuhd78l/exec";
    
    // 빈 객체로 시작하여 구글 시트에서 데이터를 받아와 채울 예정
    let studentData = {};

    window.onload = function() {
      // 1. 오늘 날짜를 기본값으로 설정
      const today = new Date();
      const offset = today.getTimezoneOffset() * 60000;
      const localToday = new Date(today.getTime() - offset).toISOString().split('T')[0];
      document.getElementById('req-date').value = localToday;

      // 2. 서버(구글 시트)에서 실시간 명단 불러오기
      fetch(`${API_URL}?action=getStudents`)
        .then(res => res.json())
        .then(data => {
          if (data.success && data.students) {
            studentData = data.students; // 시트의 명단으로 업데이트
            
            // 학번 입력창 활성화
            const idInput = document.getElementById('req-id');
            idInput.disabled = false;
            idInput.placeholder = "예: 10101";
          }
        })
        .catch(err => {
          console.error("명단을 불러오지 못했습니다.", err);
          document.getElementById('req-id').placeholder = "오류: 새로고침 해주세요.";
        });

      // 3. 학번 입력 시 이름 자동 완성 이벤트
      const idInput = document.getElementById('req-id');
      const nameInput = document.getElementById('req-name');
      const errorDiv = document.getElementById('error-msg');

      idInput.addEventListener('input', function() {
        const idVal = idInput.value.trim();
        
        if (idVal.length === 5) {
          if (studentData[idVal]) {
            nameInput.value = studentData[idVal];
            nameInput.classList.add('auto-filled');
            errorDiv.style.display = 'none';
          } else {
            nameInput.value = "";
            nameInput.classList.remove('auto-filled');
            showError('등록되지 않은 학번입니다. 학번을 다시 확인해주세요.', 'req-id');
          }
        } else {
          nameInput.value = "";
          nameInput.classList.remove('auto-filled');
          errorDiv.style.display = 'none';
        }
      });
    };

    function showError(message, elementId) {
      const errorDiv = document.getElementById('error-msg');
      const inputEl = document.getElementById(elementId);
      
      errorDiv.style.display = 'block';
      errorDiv.innerHTML = "⚠️ " + message;
      
      inputEl.classList.remove('shake');
      void inputEl.offsetWidth;
      inputEl.classList.add('shake');
      inputEl.focus();
      
      setTimeout(() => inputEl.classList.remove('shake'), 400);
    }

    function submitAbsence() {
      const dateEl = document.getElementById('req-date');
      const idEl = document.getElementById('req-id');
      const nameEl = document.getElementById('req-name');
      const reasonEl = document.getElementById('req-reason');
      const errorDiv = document.getElementById('error-msg');
      
      const date = dateEl.value;
      const id = idEl.value.trim();
      const name = nameEl.value.trim();
      const reason = reasonEl.value.trim();
      
      errorDiv.style.display = 'none';

      if (!date) return showError('결석할 날짜를 선택해주세요.', 'req-date');
      if (!id) return showError('학번을 입력해주세요.', 'req-id');
      if (isNaN(id) || id.length !== 5) return showError('학번은 정확히 5자리 숫자로 입력해주세요.', 'req-id');
      if (!name || !studentData[id]) return showError('등록되지 않은 학번입니다. 올바른 학번을 입력해주세요.', 'req-id');
      if (!reason) return showError('결석 사유를 입력해주세요.', 'req-reason');
      if (reason.length < 3) return showError('사유를 조금 더 구체적으로 작성해주세요.', 'req-reason');

      const btn = document.getElementById('submit-btn');
      btn.innerText = "제출 중입니다... ⏳";
      btn.disabled = true;

      const submitUrl = `${API_URL}?action=submitAbsence&date=${date}&id=${id}&name=${encodeURIComponent(name)}&reason=${encodeURIComponent(reason)}`;
      
      fetch(submitUrl, { method: "GET", redirect: "follow" })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            alert(`✅ ${name} 학생의 결석 신청이 완료되었습니다.`);
            idEl.value = '';
            nameEl.value = '';
            nameEl.classList.remove('auto-filled');
            reasonEl.value = '';
          } else {
            alert("❌ 신청 실패: " + data.message);
          }
        })
        .catch(err => {
          alert("서버 통신 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.");
        })
        .finally(() => {
          btn.innerText = "신청서 제출하기";
          btn.disabled = false;
        });
    }
  </script>
</body>
</html>
